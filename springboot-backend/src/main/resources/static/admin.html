<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Textile Haven</title>
    <link rel="icon" type="image/png" href="assets/textile-haven-LOGO.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#F59E0B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Admin Header -->
    <div class="bg-white shadow">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900">Admin Dashboard</h1>
                <p class="text-gray-500 text-sm mt-1">Manage products, inventory, and sizes via Spring Boot REST API</p>
            </div>
            <button onclick="openProductModal()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2.5 rounded-xl shadow transition flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                <span>Add New Product</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <!-- Stats Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <div class="text-sm font-semibold text-gray-500">Total Products</div>
                <div id="stat-total-products" class="text-3xl font-black text-purple-600 mt-2">0</div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <div class="text-sm font-semibold text-gray-500">Total Units in Stock</div>
                <div id="stat-total-stock" class="text-3xl font-black text-green-600 mt-2">0</div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <div class="text-sm font-semibold text-gray-500">Backend Status</div>
                <div class="text-sm font-bold text-gray-800 mt-3 flex items-center">
                    <span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span>
                    Spring Boot 8080 Active
                </div>
            </div>
        </div>

        <!-- Products Table Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-900">Store Products & Inventory</h2>
                <button onclick="loadAdminProducts()" class="text-sm text-purple-600 hover:text-purple-800 font-semibold flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Refresh
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 font-bold uppercase text-xs border-b">
                        <tr>
                            <th class="px-6 py-4">Product</th>
                            <th class="px-6 py-4">Price</th>
                            <th class="px-6 py-4">Sizes & Stock</th>
                            <th class="px-6 py-4">Total Stock</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-table" class="divide-y divide-gray-100">
                        <tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">Loading products...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Product Modal (Add/Edit) -->
    <div id="productModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50 flex items-center justify-center p-4">
        <div class="relative bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 md:p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-4 border-b">
                <h3 id="modalTitle" class="text-2xl font-bold text-gray-900">Add New Product</h3>
                <button onclick="closeProductModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form id="productForm" class="mt-6 space-y-5">
                <input type="hidden" id="editProductId">

                <div>
                    <label class="block text-sm font-bold text-gray-700">Product Name *</label>
                    <input type="text" id="prodName" required placeholder="Floral Summer Midi Dress"
                        class="mt-1 block w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700">Description *</label>
                    <textarea id="prodDescription" rows="3" required placeholder="Detailed fabric and styling description..."
                        class="mt-1 block w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700">Price ($ USD) *</label>
                    <input type="number" step="0.01" min="0.01" id="prodPrice" required placeholder="49.99"
                        class="mt-1 block w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Main Image (Image 1)</label>
                        <input type="file" id="prodImage1" accept="image/*"
                            class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Secondary Image (Image 2)</label>
                        <input type="file" id="prodImage2" accept="image/*"
                            class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                    </div>
                </div>

                <!-- Sizes & Inventory Stock Grid -->
                <div class="border-t pt-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Inventory Stock by Size</label>
                    <div id="size-stocks-container" class="grid grid-cols-3 sm:grid-cols-6 gap-3">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <div id="modalAlert" class="hidden p-3 rounded-xl text-sm font-medium"></div>

                <div class="flex justify-end space-x-3 border-t pt-4">
                    <button type="button" onclick="closeProductModal()" class="px-5 py-2.5 border rounded-xl font-bold text-gray-600 hover:bg-gray-50">Cancel</button>
                    <button type="submit" id="saveProdBtn" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold shadow">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container" class="mt-auto"></div>

    <script src="js/api.js?v=2.2"></script>
    <script>
        let allSizes = [];
        let allProducts = [];

        async function initAdmin() {
            if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
                alert('Access restricted to administrators. Please login as admin.');
                window.location.href = 'index.html';
                return;
            }

            try {
                const sizeRes = await SizeAPI.getAll();
                if (sizeRes.success) allSizes = sizeRes.data;
                renderSizeInputs({});
                await loadAdminProducts();
            } catch (e) {
                console.error('Admin init error:', e);
            }
        }

        async function loadAdminProducts() {
            const tbody = document.getElementById('admin-products-table');
            try {
                const res = await ProductAPI.getProducts({ all: true });
                if (!res.success || !res.data) {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Failed to load products.</td></tr>';
                    return;
                }

                allProducts = res.data.products || [];
                document.getElementById('stat-total-products').textContent = allProducts.length;

                let grandTotalStock = 0;
                allProducts.forEach(p => grandTotalStock += (p.totalStock || 0));
                document.getElementById('stat-total-stock').textContent = grandTotalStock;

                if (allProducts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No products found. Add your first product!</td></tr>';
                    return;
                }

                tbody.innerHTML = allProducts.map(p => {
                    const img = ProductAPI.formatImageUrl(p.mainImage);
                    const sizesInfo = (p.sizes || []).map(s => `
                        <span class="inline-block bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded font-mono mr-1 mb-1">
                            ${escapeHtml(s.name)}: <strong>${s.stockQuantity}</strong>
                        </span>
                    `).join('');

                    return `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 flex items-center space-x-4">
                            <img src="${img}" class="w-12 h-14 object-cover rounded-lg bg-gray-100 flex-shrink-0" onerror="handleImageError(this)">
                            <div>
                                <div class="font-bold text-gray-900">${escapeHtml(p.name)}</div>
                                <div class="text-xs text-gray-500 truncate max-w-xs">${escapeHtml(p.description || '')}</div>
                            </div>
                        </td>
                        <td class="px-6 py-4 font-bold text-gray-900">${ProductAPI.formatPrice(p.price)}</td>
                        <td class="px-6 py-4">${sizesInfo || '<span class="text-gray-400">None</span>'}</td>
                        <td class="px-6 py-4">
                            <span class="font-bold ${p.totalStock > 0 ? 'text-green-600' : 'text-red-500'}">
                                ${p.totalStock} units
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button onclick="editProduct(${p.id})" class="text-purple-600 hover:text-purple-800 font-bold text-xs bg-purple-50 hover:bg-purple-100 px-3 py-1.5 rounded-lg transition">Edit</button>
                            <button onclick="deleteProduct(${p.id}, '${escapeHtml(p.name)}')" class="text-red-600 hover:text-red-800 font-bold text-xs bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition">Delete</button>
                        </td>
                    </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Error connecting to Spring Boot server.</td></tr>';
            }
        }

        function renderSizeInputs(existingStocks = {}) {
            const container = document.getElementById('size-stocks-container');
            if (!container) return;
            container.innerHTML = allSizes.map(size => {
                const val = existingStocks[size.id] !== undefined ? existingStocks[size.id] : 0;
                return `
                <div class="bg-gray-50 p-2.5 rounded-xl border text-center">
                    <label class="block text-xs font-bold text-gray-700">${escapeHtml(size.name)}</label>
                    <input type="number" min="0" name="size_${size.id}" value="${val}"
                        class="mt-1 w-full text-center py-1 border rounded-lg text-sm font-semibold focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                `;
            }).join('');
        }

        function openProductModal() {
            document.getElementById('editProductId').value = '';
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('prodName').value = '';
            document.getElementById('prodDescription').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodImage1').value = '';
            document.getElementById('prodImage2').value = '';
            document.getElementById('modalAlert').classList.add('hidden');
            renderSizeInputs({});
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function editProduct(productId) {
            const p = allProducts.find(item => item.id === productId);
            if (!p) return;

            document.getElementById('editProductId').value = p.id;
            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('prodName').value = p.name || '';
            document.getElementById('prodDescription').value = p.description || '';
            document.getElementById('prodPrice').value = p.price || '';
            document.getElementById('prodImage1').value = '';
            document.getElementById('prodImage2').value = '';
            document.getElementById('modalAlert').classList.add('hidden');

            const stockMap = {};
            (p.sizes || []).forEach(s => stockMap[s.sizeId] = s.stockQuantity);
            renderSizeInputs(stockMap);

            document.getElementById('productModal').classList.remove('hidden');
        }

        async function deleteProduct(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"?`)) return;
            try {
                const res = await ProductAPI.delete(id);
                if (res.success) {
                    showToast('Product deleted successfully', 'success');
                    loadAdminProducts();
                } else {
                    showToast(res.message || 'Failed to delete product', 'error');
                }
            } catch (e) {
                showToast('Network error deleting product', 'error');
            }
        }

        document.getElementById('productForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editProductId').value;
            const btn = document.getElementById('saveProdBtn');
            const alertDiv = document.getElementById('modalAlert');
            alertDiv.classList.add('hidden');

            const formData = new FormData();
            formData.append('name', document.getElementById('prodName').value.trim());
            formData.append('description', document.getElementById('prodDescription').value.trim());
            formData.append('price', document.getElementById('prodPrice').value.trim());

            const file1 = document.getElementById('prodImage1').files[0];
            const file2 = document.getElementById('prodImage2').files[0];
            if (file1) formData.append('image1', file1);
            if (file2) formData.append('image2', file2);

            allSizes.forEach(s => {
                const input = document.querySelector(`input[name="size_${s.id}"]`);
                if (input) {
                    formData.append(`size_${s.id}`, input.value || '0');
                }
            });

            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                let res;
                if (editId) {
                    res = await ProductAPI.update(editId, formData);
                } else {
                    res = await ProductAPI.create(formData);
                }

                if (res.success) {
                    closeProductModal();
                    showToast(editId ? 'Product updated!' : 'Product added!', 'success');
                    loadAdminProducts();
                } else {
                    alertDiv.textContent = res.message || 'Error saving product';
                    alertDiv.className = 'mt-3 p-3 rounded-xl text-sm font-medium bg-red-100 text-red-700';
                    alertDiv.classList.remove('hidden');
                }
            } catch (err) {
                alertDiv.textContent = 'Network error communicating with Spring Boot';
                alertDiv.className = 'mt-3 p-3 rounded-xl text-sm font-medium bg-red-100 text-red-700';
                alertDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Product';
            }
        });

        document.addEventListener('DOMContentLoaded', initAdmin);
    </script>
</body>
</html>
