<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Textile Haven</title>
    <link rel="icon" type="image/png" href="assets/textile-haven-LOGO.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#F59E0B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <!-- Multi-Step Progress Indicator (HCI Heuristic #1: Visibility of System Status) -->
        <div class="max-w-2xl mx-auto mb-8">
            <div class="flex items-center justify-between text-xs sm:text-sm font-bold">
                <!-- Step 1 -->
                <a href="cart.html" class="flex items-center space-x-2 text-emerald-600 hover:text-emerald-700 transition">
                    <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center font-black">✓</div>
                    <span>1. Cart</span>
                </a>
                <div class="flex-1 h-0.5 bg-emerald-500 mx-3"></div>
                <!-- Step 2 -->
                <div class="flex items-center space-x-2 text-purple-600">
                    <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center font-black shadow-sm">2</div>
                    <span>2. Shipping & Payment</span>
                </div>
                <div class="flex-1 h-0.5 bg-gray-200 mx-3"></div>
                <!-- Step 3 -->
                <div class="flex items-center space-x-2 text-gray-400">
                    <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-black">3</div>
                    <span>3. Confirmation</span>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-black text-gray-900">Checkout & Secure Payment</h1>
            <a href="cart.html" class="text-xs sm:text-sm text-purple-600 hover:underline font-semibold">&larr; Return to Cart</a>
        </div>

        <div id="checkout-content" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Loading Skeleton -->
            <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm animate-pulse h-96"></div>
            <div class="lg:col-span-1 bg-white rounded-2xl p-6 shadow-sm animate-pulse h-72"></div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container" class="mt-auto"></div>

    <script src="js/api.js?v=2.1"></script>
    <script>
        let cartData = null;

        async function initCheckout() {
            const container = document.getElementById('checkout-content');

            if (!Auth.isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await CartAPI.getCart();
                if (!res.success || !res.data || !res.data.items || res.data.items.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-3 bg-white rounded-2xl p-12 text-center shadow-sm border max-w-lg mx-auto">
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">Your Cart is Empty</h2>
                            <p class="text-gray-500 mb-6">Add items to your cart before proceeding to checkout.</p>
                            <a href="products.html" class="bg-purple-600 text-white font-bold px-6 py-3 rounded-xl inline-block">Browse Products</a>
                        </div>
                    `;
                    return;
                }

                cartData = res.data;
                const user = Auth.getUser();

                container.innerHTML = `
                <!-- Shipping and Payment Form -->
                <div class="lg:col-span-2">
                    <form id="checkout-form" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 space-y-6">
                        <h2 class="text-xl font-bold text-gray-900 border-b pb-3">Shipping Details</h2>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Full Name *</label>
                                <input type="text" id="fullName" required value="${escapeHtml(user.username || '')}"
                                    class="mt-1 block w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Email Address *</label>
                                <input type="email" id="email" required value="${escapeHtml(user.email || '')}"
                                    class="mt-1 block w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Street Address *</label>
                            <input type="text" id="address" required placeholder="123 Main St, Apt 4B"
                                class="mt-1 block w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">City *</label>
                                <input type="text" id="city" required placeholder="New York"
                                    class="mt-1 block w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Postal Code *</label>
                                <input type="text" id="postalCode" required placeholder="10001"
                                    class="mt-1 block w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Phone Number *</label>
                                <input type="tel" id="phone" required placeholder="+1 555-0199"
                                    class="mt-1 block w-full px-3 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
                            </div>
                        </div>

                        <h2 class="text-xl font-bold text-gray-900 border-b pb-3 pt-4">Payment Method</h2>
                        <div class="space-y-3">
                            <label class="flex items-center p-4 border rounded-xl cursor-pointer hover:bg-gray-50 border-purple-500 bg-purple-50">
                                <input type="radio" name="payment" value="card" checked class="text-purple-600 focus:ring-purple-500 h-4 w-4">
                                <span class="ml-3 font-semibold text-gray-800">Credit / Debit Card (Online Demo)</span>
                            </label>
                            <label class="flex items-center p-4 border rounded-xl cursor-pointer hover:bg-gray-50">
                                <input type="radio" name="payment" value="cod" class="text-purple-600 focus:ring-purple-500 h-4 w-4">
                                <span class="ml-3 font-semibold text-gray-800">Cash on Delivery</span>
                            </label>
                        </div>

                        <div id="checkout-error" class="hidden p-3 rounded-lg bg-red-100 text-red-700 text-sm font-medium"></div>

                        <button type="submit" id="place-order-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200">
                            Confirm & Place Order
                        </button>
                    </form>
                </div>

                <!-- Order Summary Column (HCI: Recognition rather than recall) -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sticky top-24 space-y-4">
                        <div class="flex justify-between items-center pb-3 border-b border-gray-100">
                            <h2 class="text-base font-black text-gray-900">Order Items</h2>
                            <span class="text-xs font-bold bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full">${cartData.count} item(s)</span>
                        </div>
                        <div class="max-h-72 overflow-y-auto divide-y divide-gray-100 pr-1 space-y-2">
                            ${cartData.items.map(item => `
                                <div class="pt-2 first:pt-0 flex items-center gap-3">
                                    <img src="${ProductAPI.formatImageUrl(item.mainImage || item.image1)}" class="w-12 h-14 object-cover rounded-lg bg-gray-100 flex-shrink-0" onerror="handleImageError(this)">
                                    <div class="flex-1 min-w-0">
                                        <div class="font-bold text-xs text-gray-900 truncate">${escapeHtml(item.productName)}</div>
                                        <div class="text-[11px] text-gray-500 mt-0.5">${item.sizeName ? `Size: ${escapeHtml(item.sizeName)} · ` : ''}Qty: ${item.quantity}</div>
                                    </div>
                                    <span class="font-black text-xs text-gray-900">${ProductAPI.formatPrice(item.subtotal)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="border-t border-gray-100 pt-3 space-y-2 text-xs sm:text-sm">
                            <div class="flex justify-between text-gray-600">
                                <span>Items Subtotal</span>
                                <span class="font-bold text-gray-900">${ProductAPI.formatPrice(cartData.total)}</span>
                            </div>
                            <div class="flex justify-between text-gray-600">
                                <span>Standard Delivery</span>
                                <span class="font-bold text-emerald-600">FREE</span>
                            </div>
                            <div class="flex justify-between text-gray-600">
                                <span>Estimated Tax (0%)</span>
                                <span class="font-bold text-gray-900">$0.00</span>
                            </div>
                            <div class="flex justify-between items-center border-t border-gray-100 pt-3 text-base">
                                <span class="font-black text-gray-900">Total Due</span>
                                <span class="font-black text-2xl text-purple-700">${ProductAPI.formatPrice(cartData.total)}</span>
                            </div>
                        </div>

                        <!-- Trust signals -->
                        <div class="pt-2 text-[11px] text-gray-400 text-center flex items-center justify-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            <span>Encrypted & secure checkout</span>
                        </div>
                    </div>
                </div>
                `;

                document.getElementById('checkout-form')?.addEventListener('submit', handleCheckoutSubmit);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="col-span-3 text-center py-12 text-red-500">Error loading checkout information.</div>';
            }
        }

        async function handleCheckoutSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('place-order-btn');
            const errDiv = document.getElementById('checkout-error');
            errDiv.classList.add('hidden');

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                address: document.getElementById('address').value.trim(),
                city: document.getElementById('city').value.trim(),
                postalCode: document.getElementById('postalCode').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                paymentMethod: document.querySelector('input[name="payment"]:checked')?.value || 'card'
            };

            btn.disabled = true;
            btn.textContent = 'Processing Order...';

            try {
                const res = await OrderAPI.checkout(payload);
                if (res.success && res.data) {
                    sessionStorage.setItem('th_last_order', JSON.stringify(res.data));
                    window.location.href = 'checkout-success.html';
                } else {
                    errDiv.textContent = res.message || 'Failed to place order';
                    errDiv.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Confirm & Place Order';
                }
            } catch (e) {
                errDiv.textContent = 'Network error while placing order';
                errDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Confirm & Place Order';
            }
        }

        document.addEventListener('DOMContentLoaded', initCheckout);
    </script>
</body>
</html>
