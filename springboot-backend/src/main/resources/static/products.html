<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Collection - Textile Haven</title>
    <link rel="icon" type="image/png" href="assets/textile-haven-LOGO.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#F59E0B',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Page Header & Breadcrumb (HCI: Visibility of System Status & Orientation) -->
    <header class="bg-white border-b">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <nav aria-label="Breadcrumb" class="flex text-xs text-gray-500 mb-2 items-center space-x-1.5">
                <a href="index.html" class="hover:text-purple-600 transition">Home</a>
                <span>/</span>
                <span class="text-purple-700 font-semibold" aria-current="page">Shop Collection</span>
            </nav>
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-black text-gray-900" id="page-title">Women's Fashion Collection</h1>
                    <p class="text-gray-500 text-sm mt-1" id="product-count">Loading products...</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content (WCAG 2.1 Landmark) -->
    <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <!-- Interactive Controls Bar (HCI: Hick's Law & Nielsen #7 Efficiency) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-8 flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
            <!-- Search Input with Keyboard Shortcut indicator -->
            <form id="search-form" class="flex gap-2 flex-1 max-w-md">
                <div class="relative flex-1">
                    <input type="text" id="search-input" placeholder="Search dresses, tops, fabrics..."
                        aria-label="Search products"
                        class="w-full px-4 py-2.5 pl-10 pr-9 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-sm shadow-inner">
                    <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <kbd title="Press / to search" class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono bg-gray-100 border border-gray-300 rounded text-gray-500 absolute right-3 top-3">
                        /
                    </kbd>
                </div>
                <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm px-5 py-2.5 rounded-xl transition shadow-sm hover:shadow">
                    Search
                </button>
                <button type="button" id="clear-search-btn" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold px-3 py-2.5 rounded-xl transition" title="Clear search">
                    Clear
                </button>
            </form>

            <!-- Filters & Sorting Controls (HCI Heuristics #7) -->
            <div class="flex flex-wrap items-center gap-4">
                <!-- In-Stock Filter Toggle -->
                <label class="flex items-center space-x-2 text-sm text-gray-700 font-medium cursor-pointer select-none">
                    <input type="checkbox" id="stock-filter" class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
                    <span>In-Stock Only</span>
                </label>

                <!-- Sort Dropdown -->
                <div class="flex items-center space-x-2">
                    <label for="sort-select" class="text-xs font-semibold text-gray-500 uppercase">Sort:</label>
                    <select id="sort-select" class="text-sm bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-purple-500 focus:outline-none font-medium">
                        <option value="featured">Featured / Default</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name-asc">Name: A to Z</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Skeleton cards -->
            <div class="bg-white rounded-xl shadow-sm h-80 animate-pulse"></div>
            <div class="bg-white rounded-xl shadow-sm h-80 animate-pulse"></div>
            <div class="bg-white rounded-xl shadow-sm h-80 animate-pulse"></div>
            <div class="bg-white rounded-xl shadow-sm h-80 animate-pulse"></div>
        </div>

        <!-- Pagination -->
        <div id="pagination-container" class="mt-12 flex justify-center items-center gap-2"></div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container" class="mt-auto"></div>

    <script src="js/api.js?v=2.2"></script>
    <script>
        let currentPage = 1;
        let currentSearch = '';
        let rawProducts = [];
        let totalPages = 1;

        async function loadProducts(page = 1, search = '') {
            currentPage = page;
            currentSearch = search;

            const grid = document.getElementById('products-grid');
            const countLabel = document.getElementById('product-count');
            const titleLabel = document.getElementById('page-title');
            const clearBtn = document.getElementById('clear-search-btn');

            if (search) {
                clearBtn.classList.remove('hidden');
                titleLabel.textContent = `Search Results for "${search}"`;
            } else {
                clearBtn.classList.add('hidden');
                titleLabel.textContent = "Women's Fashion Collection";
            }

            try {
                const res = await ProductAPI.getProducts({ page: page, size: 12, search: search });
                if (!res.success || !res.data) {
                    grid.innerHTML = '<div class="col-span-4 text-center py-12 text-gray-500">Failed to load products.</div>';
                    return;
                }

                rawProducts = res.data.products || [];
                const total = res.data.total;
                totalPages = res.data.pages;

                countLabel.textContent = `Showing ${rawProducts.length} of ${total} products`;

                applyFiltersAndRender();
                renderPagination(totalPages, page);
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-4 text-center py-12 text-red-500">Error connecting to Spring Boot server.</div>';
            }
        }

        function applyFiltersAndRender() {
            const grid = document.getElementById('products-grid');
            const stockOnly = document.getElementById('stock-filter')?.checked || false;
            const sortBy = document.getElementById('sort-select')?.value || 'featured';

            let filtered = [...rawProducts];

            if (stockOnly) {
                filtered = filtered.filter(p => p.hasStock);
            }

            if (sortBy === 'price-asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortBy === 'price-desc') {
                filtered.sort((a, b) => b.price - a.price);
            } else if (sortBy === 'name-asc') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-4 text-center py-16 bg-white rounded-2xl border border-dashed border-gray-300 p-8">
                        <div class="w-16 h-16 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800">No matching dresses found</h3>
                        <p class="text-gray-500 text-sm mt-1">Try relaxing your search terms or unchecking "In-Stock Only".</p>
                        <button onclick="clearSearch()" class="mt-4 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs uppercase tracking-wider px-5 py-2.5 rounded-xl shadow-sm transition">
                            Reset All Filters
                        </button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(product => {
                const mainImg = ProductAPI.formatImageUrl(product.mainImage);
                const hasStock = product.hasStock;

                return `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col border border-gray-100 group">
                    <div class="relative aspect-[3/4] overflow-hidden bg-gray-100">
                        <a href="product-details.html?id=${product.id}" aria-label="View details for ${escapeHtml(product.name)}">
                            <img src="${mainImg}" alt="${escapeHtml(product.name)}"
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                 onerror="handleImageError(this)">
                        </a>
                        <span class="absolute top-3 right-3 text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm ${
                            hasStock ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'
                        }">
                            ${hasStock ? 'In Stock' : 'Sold Out'}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-gray-900 group-hover:text-purple-600 transition leading-snug">
                                <a href="product-details.html?id=${product.id}">${escapeHtml(product.name)}</a>
                            </h3>
                            <p class="text-gray-500 text-xs mt-1.5 line-clamp-2 leading-relaxed">${escapeHtml(product.description || '')}</p>
                        </div>
                        <div class="mt-5 pt-3.5 border-t border-gray-100 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-gray-400 block font-medium">Price</span>
                                <span class="text-xl font-black text-purple-700">${ProductAPI.formatPrice(product.price)}</span>
                            </div>
                            <a href="product-details.html?id=${product.id}" 
                               class="bg-purple-50 hover:bg-purple-600 hover:text-white text-purple-700 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-xs">
                                View Details
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderPagination(totalPages, activePage) {
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            if (activePage > 1) {
                html += `<button onclick="loadProducts(${activePage - 1}, currentSearch)" class="px-3.5 py-2 border rounded-xl bg-white hover:bg-gray-50 text-sm font-semibold shadow-xs">Prev</button>`;
            }

            for (let i = 1; i <= totalPages; i++) {
                if (i === activePage) {
                    html += `<span class="px-3.5 py-2 border rounded-xl bg-purple-600 text-white text-sm font-bold shadow-xs">${i}</span>`;
                } else {
                    html += `<button onclick="loadProducts(${i}, currentSearch)" class="px-3.5 py-2 border rounded-xl bg-white hover:bg-gray-50 text-sm font-semibold shadow-xs">${i}</button>`;
                }
            }

            if (activePage < totalPages) {
                html += `<button onclick="loadProducts(${activePage + 1}, currentSearch)" class="px-3.5 py-2 border rounded-xl bg-white hover:bg-gray-50 text-sm font-semibold shadow-xs">Next</button>`;
            }

            container.innerHTML = html;
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            const stockCheck = document.getElementById('stock-filter');
            if (stockCheck) stockCheck.checked = false;
            const sortSel = document.getElementById('sort-select');
            if (sortSel) sortSel.value = 'featured';
            loadProducts(1, '');
        }

        document.getElementById('stock-filter')?.addEventListener('change', applyFiltersAndRender);
        document.getElementById('sort-select')?.addEventListener('change', applyFiltersAndRender);

        document.getElementById('search-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = document.getElementById('search-input').value.trim();
            loadProducts(1, q);
        });

        document.getElementById('clear-search-btn')?.addEventListener('click', clearSearch);

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const initialSearch = params.get('search') || '';
            if (initialSearch) {
                document.getElementById('search-input').value = initialSearch;
            }
            loadProducts(1, initialSearch);
        });
    </script>
</body>
</html>
